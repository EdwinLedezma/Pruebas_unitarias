services:
  mongodb:
    image: mongo:8.0.17
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  sonarqube:
    image: sonarqube:25.12.0.117093-community
    profiles: [quality]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

volumes:
  mongo-data:
  sonar-data:
  sonar-extensions:
